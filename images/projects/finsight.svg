<svg xmlns="http://www.w3.org/2000/svg" width="420" height="192" viewBox="0 0 420 192" role="img" aria-label="FinSight: Ask a 10-K anything. Get the exact page.">
<title>FinSight</title>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#E8C766"/><stop offset="1" stop-color="#E06C75"/>
  </linearGradient>
  <linearGradient id="gb" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="420" y2="0">
    <stop offset="0" stop-color="#E8C766"/><stop offset="1" stop-color="#E06C75"/>
  </linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#fff" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="ball" cx="0.35" cy="0.3" r="0.8">
    <stop offset="0" stop-color="#FFF1B0"/><stop offset="0.5" stop-color="#E8C766"/><stop offset="1" stop-color="#A9791F"/>
  </radialGradient>
  <clipPath id="c"><rect x="0.5" y="0.5" width="419" height="191" rx="14"/></clipPath>
</defs>
<style>
  .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .in { animation: rise .7s cubic-bezier(.2,.7,.2,1) backwards; }
  .bar { stroke-dasharray: 420; animation: draw 1.1s ease-out 0.00s backwards; }
  .shine { animation: sweep 5s ease-in-out 1.60s infinite; transform: translateX(-160px); }
  .wing { fill: #E9E2C4; opacity: .75; transform-box: fill-box; animation: flap .22s ease-in-out infinite alternate; }
  .wl { transform-origin: right center; }
  .wr { transform-origin: left center; }
  .hover { animation: bob 2.6s ease-in-out infinite; }
  .chip rect { fill: #161b22; stroke: #30363d; }
  .chip text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; fill: #c9d1d9; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes draw { from { stroke-dashoffset: 420; } to { stroke-dashoffset: 0; } }
  @keyframes sweep { 0% { transform: translateX(-160px); } 40%, 100% { transform: translateX(460px); } }
  @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(.25); } }
  @keyframes bob { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-2px, -3px); } }
  @media (prefers-reduced-motion: reduce) {
    .in, .bar, .shine, .wing, .hover { animation: none; }
  }
</style>
<g clip-path="url(#c)">
  <rect width="420" height="192" fill="#0d1117"/>
  <line class="bar" x1="0" y1="2" x2="420" y2="2" stroke="url(#gb)" stroke-width="4"/>
  <rect class="shine" x="0" y="0" width="120" height="4" fill="url(#shine)"/>
</g>
<rect x="0.5" y="0.5" width="419" height="191" rx="14" fill="none" stroke="#30363d"/>
<g class="in" style="animation-delay:0.15s">
  <text class="t" x="24" y="44" font-size="20" font-weight="700" fill="url(#g)">FinSight</text>
  <g class="hover">
    <g transform="rotate(-18 372 36)"><ellipse class="wing wl" cx="372" cy="36" rx="8" ry="2.6"/></g>
    <g transform="rotate(18 388 36)"><ellipse class="wing wr" cx="388" cy="36" rx="8" ry="2.6"/></g>
    <circle cx="380" cy="38" r="4.6" fill="url(#ball)"/>
  </g>
</g>
<text class="t in" style="animation-delay:0.30s" x="24" y="80" font-size="17" font-weight="600" fill="#f0f6fc">Ask a 10-K anything. Get the exact page.</text>
<g class="in" style="animation-delay:0.45s">
  <text class="t" x="24" y="106" font-size="13" fill="#8b949e">A RAG copilot over SEC filings that cites every</text>
  <text class="t" x="24" y="124" font-size="13" fill="#8b949e">answer, or admits it can't find one.</text>
</g>
<g class="in" style="animation-delay:0.60s"><g class="chip"><rect x="24" y="146" width="57" height="22" rx="11"/><text x="52.5" y="161" text-anchor="middle">Python</text></g><g class="chip"><rect x="89" y="146" width="57" height="22" rx="11"/><text x="117.5" y="161" text-anchor="middle">Gemini</text></g><g class="chip"><rect x="154" y="146" width="57" height="22" rx="11"/><text x="182.5" y="161" text-anchor="middle">Qdrant</text></g><g class="chip"><rect x="219" y="146" width="64" height="22" rx="11"/><text x="251.0" y="161" text-anchor="middle">FastAPI</text></g></g>
</svg>
