<svg xmlns="http://www.w3.org/2000/svg" width="420" height="196" viewBox="0 0 420 196" role="img" aria-label="FinSight: Citation-first RAG copilot over SEC filings">
<title>FinSight</title>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#E8C766"/><stop offset="1" stop-color="#E06C75"/>
  </linearGradient>
  <linearGradient id="gb" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="420" y2="0">
    <stop offset="0" stop-color="#E8C766"/><stop offset="1" stop-color="#E06C75"/>
  </linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#fff" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="c"><rect x="0.5" y="0.5" width="419" height="195" rx="14"/></clipPath>
</defs>
<style>
  .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .in { animation: rise .7s cubic-bezier(.2,.7,.2,1) backwards; }
  .bar { stroke-dasharray: 420; animation: draw 1.1s ease-out 0.00s backwards; }
  .shine { animation: sweep 5s ease-in-out 1.60s infinite; transform: translateX(-160px); }
  .dot { animation: pulse 2.4s ease-in-out 1.20s infinite; transform-origin: center; transform-box: fill-box; }
  .chip rect { fill: #161b22; stroke: #30363d; }
  .chip text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; fill: #c9d1d9; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes draw { from { stroke-dashoffset: 420; } to { stroke-dashoffset: 0; } }
  @keyframes sweep { 0% { transform: translateX(-160px); } 40%, 100% { transform: translateX(460px); } }
  @keyframes pulse { 0%, 100% { opacity: .35; transform: scale(1); } 50% { opacity: 1; transform: scale(1.35); } }
  @media (prefers-reduced-motion: reduce) {
    .in, .bar, .shine, .dot { animation: none; }
    .shine { opacity: 0; }
  }
</style>
<g clip-path="url(#c)">
  <rect width="420" height="196" fill="#0d1117"/>
  <line class="bar" x1="0" y1="2" x2="420" y2="2" stroke="url(#gb)" stroke-width="4"/>
  <rect class="shine" x="0" y="0" width="120" height="4" fill="url(#shine)"/>
</g>
<rect x="0.5" y="0.5" width="419" height="195" rx="14" fill="none" stroke="#30363d"/>
<g class="in" style="animation-delay:0.15s">
  <text class="t" x="24" y="44" font-size="20" font-weight="700" fill="url(#g)">FinSight</text>
  <text class="t" x="396" y="43" font-size="16" text-anchor="end" fill="#6e7681">↗</text>
</g>
<text class="t in" style="animation-delay:0.30s" x="24" y="68" font-size="13" fill="#8b949e">Citation-first RAG copilot over SEC filings</text>
<g class="in" style="animation-delay:0.45s">
  <circle class="dot" cx="30" cy="106" r="4" fill="#E8C766"/>
  <text class="t" x="44" y="116" font-size="30" font-weight="700" fill="#f0f6fc">41% → 81%</text>
  <text class="t" x="24" y="140" font-size="12" fill="#8b949e">retrieval recall@10 on FinanceBench</text>
</g>
<g class="in" style="animation-delay:0.60s"><g class="chip"><rect x="24" y="156" width="57" height="22" rx="11"/><text x="52.5" y="171" text-anchor="middle">Python</text></g><g class="chip"><rect x="89" y="156" width="57" height="22" rx="11"/><text x="117.5" y="171" text-anchor="middle">Gemini</text></g><g class="chip"><rect x="154" y="156" width="57" height="22" rx="11"/><text x="182.5" y="171" text-anchor="middle">Qdrant</text></g><g class="chip"><rect x="219" y="156" width="64" height="22" rx="11"/><text x="251.0" y="171" text-anchor="middle">FastAPI</text></g></g>
</svg>
