<style>
  .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .ink { font-family: Georgia, 'Times New Roman', serif; font-style: italic; stroke: url(#ink); stroke-width: .8;
          stroke-dasharray: 900; animation: write 3.2s ease-out .3s backwards; }
  .sub { animation: fade 1s ease-out 2.8s backwards; }
  .step { fill: #E8C766; opacity: 0; animation: walk 10s linear infinite; }
  .wing { fill: #E9E2C4; opacity: .75; transform-box: fill-box; animation: flap .12s ease-in-out infinite alternate; }
  .wl { transform-origin: right center; }
  .wr { transform-origin: left center; }
  @keyframes write { 0% { stroke-dashoffset: 900; fill-opacity: 0; } 70% { stroke-dashoffset: 0; fill-opacity: 0; } 100% { stroke-dashoffset: 0; fill-opacity: 1; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes walk { 0% { opacity: 0; } 2% { opacity: .8; } 22% { opacity: .8; } 40% { opacity: 0; } 100% { opacity: 0; } }
  @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(.2); } }
  @media (prefers-reduced-motion: reduce) {
    .ink, .sub, .wing { animation: none; }
    .step { animation: none; opacity: .35; }
    .snitch { display: none; }
  }
</style>
