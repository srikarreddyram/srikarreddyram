name: Generate Basilisk Contribution Graph

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate Basilisk SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#E06C75&color_dots=#161b22,#4a3b1c,#8a6a2a,#c9a046,#E8C766
            dist/github-contribution-grid-snake-light.svg?palette=github-light&color_snake=#E06C75&color_dots=#ebedf0,#f3e3b3,#e8c766,#c9a046,#8a6a2a

      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: dist
          force_orphan: true
